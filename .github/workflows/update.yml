name: Mise à jour du calendrier

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Générer le calendrier
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
          OPENAGENDA_AGENDAS: ${{ vars.OPENAGENDA_AGENDAS }}
        run: python lyon_events.py
      - name: Publier
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || (git commit -m "Mise à jour $(date +%F)" && git push)
